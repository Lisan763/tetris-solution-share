<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tetris Solution Share</title>
  <style>/*__STYLE__*/</style>
</head>
<body>
  <header>
    <div><span class="brand">TETRIS <b>SOLUTION</b> SHARE</span><span class="sub" data-i18n="subtitle"></span></div>
    <div class="header-actions">
      <label class="language-picker"><span data-i18n="language"></span>
        <select id="language-select" aria-label="Language">
          <option value="zh-CN">中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
        </select>
      </label>
      <span class="badge" data-i18n="offline"></span>
    </div>
  </header>
  <main>
    <section class="panel setup">
      <div class="section-head"><h2 data-i18n="setupTitle"></h2><button id="clear-board" data-i18n="clearBoard"></button></div>
      <p class="muted small" data-i18n="setupHelp"></p>
      <label data-i18n="brush"></label>
      <select id="brush">
        <option>G</option><option>I</option><option>J</option><option>L</option><option>O</option><option>S</option><option>T</option><option>Z</option><option value="." data-i18n="erase"></option>
      </select>
      <canvas id="editor" width="200" height="400" data-i18n-aria="editorAria"></canvas>
      <div class="two">
        <label>Current<select id="current"><option>T</option><option>I</option><option>J</option><option>L</option><option>O</option><option>S</option><option>Z</option></select></label>
        <label>Hold<select id="hold"><option value="" data-i18n="none"></option><option>I</option><option>J</option><option>L</option><option>O</option><option>S</option><option>T</option><option>Z</option></select></label>
      </div>
      <label><span data-i18n="nextLabel"></span><input id="next" value="IJLOSTZ" autocomplete="off" spellcheck="false"></label>
      <label class="check"><input id="can-hold" type="checkbox" checked><span data-i18n="canHold"></span></label>
      <button id="start" class="primary wide" data-i18n="start"></button>
      <p id="setup-status" class="status"></p>
    </section>

    <section class="panel arena">
      <div class="section-head"><h2 data-i18n="solveTitle"></h2><span id="piece-count" class="pill"></span></div>
      <div class="playfield">
        <div class="side"><h3>HOLD</h3><canvas id="hold-view" width="80" height="96"></canvas></div>
        <canvas id="board" width="240" height="576" tabindex="0" data-i18n-aria="boardAria"></canvas>
        <div class="side next-side"><h3>NEXT</h3><canvas id="next-view" width="80" height="320"></canvas></div>
      </div>
      <p id="game-status" class="status" data-i18n="gameInitial"></p>
      <div class="buttons">
        <button id="undo"></button>
        <button id="reset"></button>
      </div>
      <div id="touch-controls" class="touch-controls"></div>
      <p class="muted small" data-i18n="undoHelp"></p>
    </section>

    <section class="panel controls">
      <h2 data-i18n="shareTitle"></h2>
      <p class="muted" data-i18n="shareIntro"></p>
      <label><span data-i18n="gifResolution"></span>
        <select id="gif-resolution">
          <option value="low" data-i18n="gifLow"></option>
          <option value="medium" data-i18n="gifMedium"></option>
          <option value="high" data-i18n="gifHigh"></option>
        </select>
      </label>
      <label for="share-code" data-i18n="shareCode"></label>
      <textarea id="share-code" rows="6" spellcheck="false" data-i18n-placeholder="codePlaceholder"></textarea>
      <div class="buttons code-buttons">
        <button id="export-gif" class="primary" disabled data-i18n="exportGif"></button>
        <button id="make-code" data-i18n="makeCode"></button>
        <button id="copy-code" data-i18n="copyCode"></button>
        <button id="load-code" data-i18n="loadCode"></button>
        <button id="code-gif" class="primary" data-i18n="codeGif"></button>
        <button id="share-code-system" hidden data-i18n="systemShareCode"></button>
      </div>
      <p id="code-status" class="status" data-i18n="codeDefault"></p>
      <div class="summary">
        <div><b id="frame-count">0</b><span data-i18n="frames"></span></div>
        <div><b id="known-count">0</b><span data-i18n="remainingNext"></span></div>
      </div>
      <details open>
        <summary data-i18n="keyTitle"></summary>
        <div id="keybindings"></div>
        <p class="muted small" data-i18n="keyHelp"></p>
      </details>
      <details>
        <summary data-i18n="thirdParty"></summary>
        <p class="muted small" data-i18n="license"></p>
      </details>
    </section>
  </main>
  <footer data-i18n="footer"></footer>
